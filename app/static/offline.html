<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <title>Offline · The Paramounts Academy</title>
  <!-- Shown by the service worker when there is no internet and the page
       wasn't saved earlier. No inline styles or scripts (strict CSP). -->
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="layout-auth">
  <main class="content content-auth">
    <section class="auth-card">
      <header class="auth-hero auth-hero-compact">
        <h1>You're offline</h1>
        <p>This page wasn't saved on your phone.</p>
      </header>
      <div class="auth-form">
        <p>Pages you opened recently, and files you saved with "Save offline", still work without internet.</p>
        <div class="button-row">
          <a class="btn btn-primary" href="/student">Home</a>
          <a class="btn btn-ghost" href="/student/saved">Saved files</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
