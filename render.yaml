# render.yaml - one-click "Blueprint" for Render (https://render.com).
# Render reads this file when you choose New > Blueprint and pick your repo.
# Values marked sync: false are asked for during setup (paste them from Neon/Supabase).
services:
  - type: web
    name: paramount-academy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true        # Render creates a long random value
      - key: DATABASE_URL
        sync: false                # Neon connection string
      - key: SUPABASE_URL
        sync: false                # https://<project>.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false                # Supabase service_role key (keep secret)
      - key: SUPABASE_BUCKET
        value: paramount-files
